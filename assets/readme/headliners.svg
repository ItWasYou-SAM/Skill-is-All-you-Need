<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="hl-title hl-desc">
  <title id="hl-title">Headliner skills</title>
  <desc id="hl-desc">Six showcase cards for famous skills: design-taste-frontend, ui-ux-pro-max, code-review, hyperframes, deep-research, and ecommerce-image-workflow.</desc>

  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="24" fill="#FAF5EA"/>

  <g id="header">
    <text class="t-mono" x="48" y="48" font-size="17" letter-spacing="3" font-weight="700" fill="#C8890A">★ HEADLINERS</text>
    <text class="t-mono" x="1152" y="48" font-size="15" letter-spacing="3" fill="#8A8271" text-anchor="end">NOTABLE SKILLS</text>
  </g>

  <!-- card 1 -->
  <g transform="translate(48 78)">
    <rect width="352" height="152" rx="14" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text class="t-mono" x="20" y="34" font-size="14" font-weight="700" fill="#C8890A">01/</text>
    <text class="t-mono" x="54" y="34" font-size="18" font-weight="700" fill="#26241F">design-taste-frontend</text>
    <text class="t-sans" x="20" y="72" font-size="16" fill="#6B6555">Premium marketing sites &amp; heroes</text>
    <text class="t-sans" x="20" y="94" font-size="16" fill="#6B6555">that don't look AI-made.</text>
    <rect x="20" y="114" width="92" height="22" rx="11" fill="#E3F0F9" stroke="#BBD7EC"/>
    <text class="t-mono" x="32" y="129" font-size="13" font-weight="700" fill="#33739E">ANTI-SLOP</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(424 78)">
    <rect width="352" height="152" rx="14" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text class="t-mono" x="20" y="34" font-size="14" font-weight="700" fill="#C8890A">01/</text>
    <text class="t-mono" x="54" y="34" font-size="18" font-weight="700" fill="#26241F">ui-ux-pro-max</text>
    <text class="t-sans" x="20" y="72" font-size="16" fill="#6B6555">Design intelligence: 50+ styles,</text>
    <text class="t-sans" x="20" y="94" font-size="16" fill="#6B6555">161 palettes, 99 UX rules.</text>
    <rect x="20" y="114" width="116" height="22" rx="11" fill="#E3F0F9" stroke="#BBD7EC"/>
    <text class="t-mono" x="32" y="129" font-size="13" font-weight="700" fill="#33739E">161 PALETTES</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(800 78)">
    <rect width="352" height="152" rx="14" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text class="t-mono" x="20" y="34" font-size="14" font-weight="700" fill="#C8890A">06/</text>
    <text class="t-mono" x="54" y="34" font-size="18" font-weight="700" fill="#26241F">code-review</text>
    <text class="t-sans" x="20" y="72" font-size="16" fill="#6B6555">Severity-ranked PR reviews with</text>
    <text class="t-sans" x="20" y="94" font-size="16" fill="#6B6555">security traps pre-flagged.</text>
    <rect x="20" y="114" width="100" height="22" rx="11" fill="#E3F0F9" stroke="#BBD7EC"/>
    <text class="t-mono" x="32" y="129" font-size="13" font-weight="700" fill="#33739E">OWASP-10</text>
  </g>

  <!-- card 4 -->
  <g transform="translate(48 258)">
    <rect width="352" height="152" rx="14" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text class="t-mono" x="20" y="34" font-size="14" font-weight="700" fill="#C8890A">04/</text>
    <text class="t-mono" x="54" y="34" font-size="18" font-weight="700" fill="#26241F">hyperframes</text>
    <text class="t-sans" x="20" y="72" font-size="16" fill="#6B6555">Script in. Storyboard, motion,</text>
    <text class="t-sans" x="20" y="94" font-size="16" fill="#6B6555">captions and rendered video out.</text>
    <rect x="20" y="114" width="118" height="22" rx="11" fill="#E3F0F9" stroke="#BBD7EC"/>
    <text class="t-mono" x="32" y="129" font-size="13" font-weight="700" fill="#33739E">VIDEO SUITE</text>
  </g>

  <!-- card 5 -->
  <g transform="translate(424 258)">
    <rect width="352" height="152" rx="14" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text class="t-mono" x="20" y="34" font-size="14" font-weight="700" fill="#C8890A">09/</text>
    <text class="t-mono" x="54" y="34" font-size="18" font-weight="700" fill="#26241F">deep-research</text>
    <text class="t-sans" x="20" y="72" font-size="16" fill="#6B6555">Web-scale research reports with</text>
    <text class="t-sans" x="20" y="94" font-size="16" fill="#6B6555">cited sources, not hallucinations.</text>
    <rect x="20" y="114" width="128" height="22" rx="11" fill="#E3F0F9" stroke="#BBD7EC"/>
    <text class="t-mono" x="32" y="129" font-size="13" font-weight="700" fill="#33739E">MULTI-AGENT</text>
  </g>

  <!-- card 6 -->
  <g transform="translate(800 258)">
    <rect width="352" height="152" rx="14" fill="#FFFFFF" stroke="#E5DCC8"/>
    <text class="t-mono" x="20" y="34" font-size="14" font-weight="700" fill="#C8890A">05/</text>
    <text class="t-mono" x="54" y="34" font-size="18" font-weight="700" fill="#26241F">ecommerce-image-workflow</text>
    <text class="t-sans" x="20" y="72" font-size="16" fill="#6B6555">Studio-grade product imagery:</text>
    <text class="t-sans" x="20" y="94" font-size="16" fill="#6B6555">generate, edit, upscale, try-on.</text>
    <rect x="20" y="114" width="76" height="22" rx="11" fill="#E3F0F9" stroke="#BBD7EC"/>
    <text class="t-mono" x="32" y="129" font-size="13" font-weight="700" fill="#33739E">FAL.AI</text>
  </g>
</svg>
