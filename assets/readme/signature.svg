<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="64" viewBox="0 0 420 64"
     role="img" aria-labelledby="sig-title sig-desc">
  <title id="sig-title">README made with beautify-github-readme</title>
  <desc id="sig-desc">Signature badge combining the skill-index motif of this repository with an arrow to beautify-github-readme.</desc>

  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="420" height="64" rx="14" fill="#0B0B10"/>
  <rect x="0.5" y="0.5" width="419" height="63" rx="13.5" fill="none" stroke="#26262F"/>

  <!-- mini skill-index motif -->
  <g transform="translate(24 18)">
    <rect width="18" height="12" rx="3" fill="#14141B" stroke="#4A3A12"/>
    <rect y="16" width="18" height="12" rx="3" fill="#14141B" stroke="#4A3A12"/>
    <rect x="22" y="16" width="18" height="12" rx="3" fill="#1C1810" stroke="#4A3A12"/>
    <rect x="22" y="16" width="6" height="12" rx="3" fill="#FFC53D"/>
  </g>

  <text class="t-mono" x="76" y="30" font-size="13" letter-spacing="2" fill="#8B8A96">README MADE WITH</text>
  <text class="t-mono" x="76" y="48" font-size="15" font-weight="700" fill="#F2F0E9">beautify-github-readme</text>
  <text class="t-mono" x="388" y="42" font-size="18" font-weight="700" fill="#FFC53D" text-anchor="end">↗</text>
</svg>
