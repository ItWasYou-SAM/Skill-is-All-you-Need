    <g transform="translate(228 56)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">07</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">WORKFLOW</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">27 SKILLS</text></g>
