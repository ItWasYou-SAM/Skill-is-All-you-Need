    <!-- row 3 -->
    <g transform="translate(0 112)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">09</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">RESEARCH</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">12 SKILLS</text></g>
    <g transform="translate(114 112)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">10</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">DOCS</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">15 SKILLS</text></g>
    <g transform="translate(228 112)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">11</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">BRAND</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">12 SKILLS</text></g>
    <g transform="translate(342 112)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">12</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">BUSINESS</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">4 SKILLS</text></g>
    <!-- row 4 -->
    <g transform="translate(0 168)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">13</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">TOOLS</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">5 REFS</text></g>
    <g transform="translate(114 168)"><rect width="218" height="44" rx="10" fill="#FCF0CC" stroke="#E3C97F"/><text class="t-mono" x="12" y="27" font-size="16" font-weight="700" fill="#C8890A">Σ 249</text><text class="t-mono" x="78" y="27" font-size="15" fill="#8A8271">AUTO-INVOKED</text></g>
