    <!-- row 3 -->
    <g transform="translate(0 112)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">09</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">RESEARCH</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">12 SKILLS</text></g>
    <g transform="translate(114 112)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">10</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">DOCS</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">15 SKILLS</text></g>
    <g transform="translate(228 112)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">11</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">BRAND</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">12 SKILLS</text></g>
    <g transform="translate(342 112)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">12</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">BUSINESS</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">4 SKILLS</text></g>
    <!-- row 4 -->
    <g transform="translate(0 168)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">13</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">TOOLS</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">5 REFS</text></g>
    <g transform="translate(114 168)"><rect width="218" height="44" rx="10" fill="#1C1810" stroke="#4A3A12"/><text class="t-mono" x="12" y="27" font-size="16" font-weight="700" fill="#FFC53D">Σ 249</text><text class="t-mono" x="78" y="27" font-size="15" fill="#8B8A96">AUTO-INVOKED</text></g>
