<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Skill is All you Need</title>
  <desc id="hero-desc">Agent skill library of 249 skills in 13 categories, shown as an index grid of skill modules beside the repository title.</desc>

  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#FAF5EA"/>

  <!-- ================= TITLE BLOCK ================= -->
  <g id="title-block" transform="translate(56 66)">
    <rect x="0" y="2" width="10" height="10" fill="#C8890A"/>
    <text class="t-mono" x="22" y="12" font-size="16" letter-spacing="4"
          fill="#8A8271">AGENT SKILL LIBRARY</text>

    <text class="t-mono" x="0" y="78" font-size="62" font-weight="700" fill="#26241F">SKILL IS ALL</text>
    <text class="t-mono" x="0" y="142" font-size="62" font-weight="700" fill="#26241F">ALL YOU NEED</text>
    <rect x="0" y="158" width="192" height="5" fill="#C8890A"/>

    <text class="t-sans" x="0" y="204" font-size="20" fill="#55503F">Production-grade skills that turn a generic agent</text>
    <text class="t-sans" x="0" y="230" font-size="20" fill="#55503F">into a domain expert. No prompt tuning required.</text>

    <text class="t-mono" x="0" y="278" font-size="16" fill="#8A8271">249 SKILLS · 13 CATEGORIES · MIT</text>
  </g>

  <!-- ================= SKILL INDEX GRID (real counts) ================= -->
