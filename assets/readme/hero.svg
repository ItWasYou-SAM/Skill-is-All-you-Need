    <g transform="translate(114 56)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">06</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">QUALITY</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">19 SKILLS</text></g>
    <g transform="translate(228 56)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">07</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">WORKFLOW</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">27 SKILLS</text></g>
