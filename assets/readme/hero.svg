    <!-- row 1 -->
    <g><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">01</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">UI/UX</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">45 SKILLS</text></g>
    <g transform="translate(114 0)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">02</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">FRONTEND</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">23 SKILLS</text></g>
    <g transform="translate(228 0)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">03</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">MOTION</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">10 SKILLS</text></g>
    <g transform="translate(342 0)"><rect width="102" height="44" rx="10" fill="#FFFFFF" stroke="#E5DCC8"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#C8890A">04</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#26241F">VIDEO</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8A8271">22 SKILLS</text></g>
    <!-- row 2 -->
