<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Skill is All you Need</title>
  <desc id="hero-desc">Agent skill library of 249 skills in 13 categories, shown as an index grid of skill modules beside the repository title.</desc>

  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0B0B10"/>

  <!-- ================= TITLE BLOCK ================= -->
  <g id="title-block" transform="translate(56 66)">
    <rect x="0" y="2" width="10" height="10" fill="#FFC53D"/>
    <text class="t-mono" x="22" y="12" font-size="16" letter-spacing="4"
          fill="#8B8A96">AGENT SKILL LIBRARY</text>

    <text class="t-mono" x="0" y="78" font-size="62" font-weight="700" fill="#F2F0E9">SKILL IS ALL</text>
    <text class="t-mono" x="0" y="142" font-size="62" font-weight="700" fill="#F2F0E9">ALL YOU NEED</text>
    <rect x="0" y="158" width="192" height="5" fill="#FFC53D"/>

    <text class="t-sans" x="0" y="204" font-size="20" fill="#C6C4CE">Production-grade skills that turn a generic agent</text>
    <text class="t-sans" x="0" y="230" font-size="20" fill="#C6C4CE">into a domain expert. No prompt tuning required.</text>

    <text class="t-mono" x="0" y="278" font-size="16" fill="#8B8A96">249 SKILLS · 13 CATEGORIES · MIT</text>
  </g>

  <!-- ================= SKILL INDEX GRID (real counts) ================= -->
  <g id="skill-index" transform="translate(700 74)">
    <!-- row 1 -->
    <g><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">01</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">UI/UX</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">45 SKILLS</text></g>
    <g transform="translate(114 0)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">02</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">FRONTEND</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">23 SKILLS</text></g>
    <g transform="translate(228 0)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">03</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">MOTION</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">10 SKILLS</text></g>
    <g transform="translate(342 0)"><rect width="102" height="44" rx="10" fill="#14141B" stroke="#26262F"/><text class="t-mono" x="10" y="19" font-size="14" font-weight="700" fill="#FFC53D">04</text><text class="t-sans" x="32" y="19" font-size="14" font-weight="600" fill="#F2F0E9">VIDEO</text><text class="t-mono" x="10" y="36" font-size="13" fill="#8B8A96">22 SKILLS</text></g>
    <!-- row 2 -->
