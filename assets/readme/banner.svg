<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="bn-title bn-desc">
  <title id="bn-title">Skill is All you Need — give your AI agent a brain upgrade</title>
  <desc id="bn-desc">Product banner: two install commands and the agent instantly delivering premium, checklist-driven output, beside the pitch headline.</desc>

  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="24" fill="#0B0B10"/>

  <!-- ================= PITCH ================= -->
  <g id="pitch" transform="translate(56 72)">
    <rect x="0" y="2" width="10" height="10" fill="#FFC53D"/>
    <text class="t-mono" x="22" y="12" font-size="16" letter-spacing="3"
          fill="#8B8A96">THE SKILL LIBRARY FOR AI AGENTS</text>

    <text class="t-mono" x="0" y="72" font-size="56" font-weight="700" fill="#F2F0E9">GIVE YOUR AGENT</text>
    <text class="t-mono" x="0" y="136" font-size="56" font-weight="700" fill="#FFC53D">A BRAIN UPGRADE</text>

    <text class="t-sans" x="0" y="188" font-size="21" fill="#C6C4CE">249 production-grade skills across 13 domains.</text>
    <text class="t-sans" x="0" y="216" font-size="21" fill="#C6C4CE">Zero config. Zero prompt tuning.</text>
    <text class="t-sans" x="0" y="244" font-size="21" fill="#C6C4CE">Your agent invokes them when it needs them.</text>

    <text class="t-mono" x="0" y="300" font-size="16" fill="#8B8A96">WORKS WITH CLAUDE CODE · OPENCODE · CURSOR · CODEX</text>
    <text class="t-mono" x="0" y="332" font-size="16" fill="#5EC97C">✓ MIT licensed — free for personal &amp; commercial use</text>
  </g>

  <!-- ================= SETUP TERMINAL ================= -->
  <g id="terminal" transform="translate(700 60)">
    <rect width="444" height="330" rx="14" fill="#12121A" stroke="#26262F"/>
    <rect width="444" height="44" rx="14" fill="#1A1A23"/>
    <rect y="22" width="444" height="22" fill="#1A1A23"/>
    <circle cx="26" cy="22" r="6" fill="#3A3A45"/>
    <circle cx="46" cy="22" r="6" fill="#3A3A45"/>
    <circle cx="66" cy="22" r="6" fill="#3A3A45"/>
    <text class="t-mono" x="222" y="27" font-size="14" fill="#8B8A96" text-anchor="middle">agent — setup</text>

    
    <text class="t-mono" x="24" y="86" font-size="16" fill="#8B8A96">$</text>
    <text class="t-mono" x="42" y="86" font-size="16" fill="#F2F0E9">cp -r */ ~/.claude/skills/</text>

    <text class="t-mono" x="24" y="122" font-size="16" fill="#5EC97C">✓ 249 skills · 13 categories installed</text>

    <text class="t-mono" x="24" y="176" font-size="16" fill="#8B8A96">you</text>
    <text class="t-mono" x="64" y="176" font-size="16" fill="#F2F0E9">"Build a landing page"</text>

    <text class="t-mono" x="24" y="204" font-size="16" fill="#FFC53D">agent</text>
    <text class="t-mono" x="76" y="204" font-size="16" fill="#F2F0E9">→ design-taste-frontend</text>

    <text class="t-mono" x="24" y="232" font-size="16" fill="#5EC97C">✓ checklist loaded · output looks</text>
    <text class="t-mono" x="42" y="256" font-size="16" fill="#5EC97C">designed, not generated</text>

    <text class="t-mono" x="24" y="312" font-size="16" fill="#F2F0E9">❯</text>
    <rect x="42" y="296" width="9" height="20" fill="#FFC53D"/>
  </g>
</svg>
